name: Build GSI

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Short build name (out/<name>/)"
        required: true
      source:
        description: "Firmware URL or path in repo"
        required: true
      rom_type:
        description: "ROM type (auto, hyperos, coloros, oneui, pixel, ...)"
        required: false
        default: "auto"
      add_tag:
        description: "Extra tag appended to build name"
        required: false
        default: ""
      compress:
        description: "Also produce a .zip"
        type: boolean
        default: true
      no_debloat:
        description: "Keep apps the ROM patch set would remove"
        type: boolean
        default: false
      inspect_only:
        description: "Just download and list the archive's contents, skip the build"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv erofs-utils aria2 patch \
            default-jre-headless curl build-essential cmake ninja-build pkg-config \
            perl golang-go libgtest-dev libusb-1.0-0-dev libpcre2-dev \
            libprotobuf-dev protobuf-compiler libbrotli-dev liblz4-dev libzstd-dev

      - name: Install apktool
        run: |
          mkdir -p "$HOME/.local/bin"
          apktool_version=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -fL -o "$HOME/.local/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/${apktool_version}/apktool_${apktool_version#v}.jar"
          printf '#!/bin/sh\nexec java -jar "%s/.local/bin/apktool.jar" "$@"\n' "$HOME" > "$HOME/.local/bin/apktool"
          chmod +x "$HOME/.local/bin/apktool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build native Android tools
        run: .venv/bin/python tools/build_android_tools.py

      - name: Download only (inspect mode)
        if: inputs.inspect_only == true
        run: |
          set -o pipefail
          mkdir -p tmp/inspect
          dest="tmp/inspect/firmware_pkg"
          if [[ "${{ inputs.source }}" =~ ^https?:// ]]; then
            aria2c -x8 -s8 -o firmware_pkg -d tmp/inspect "${{ inputs.source }}"
          else
            cp "${{ inputs.source }}" "$dest"
          fi
          echo "== file type ==" | tee inspect.log
          file "$dest" | tee -a inspect.log
          cat > /tmp/inspect_zip.py <<'PYEOF'
          import sys, zipfile

          def scan(path, prefix=""):
              try:
                  z = zipfile.ZipFile(path)
              except zipfile.BadZipFile as e:
                  print(f"{prefix}NOT A ZIP ({path}): {e}")
                  return
              for info in z.infolist():
                  name = info.filename
                  size = info.file_size
                  print(f"{prefix}{size:>12}  {name}")
                  low = name.lower()
                  if low.endswith(('.zip', '.rar', '.7z')):
                      # peek one level inside nested zip archives without
                      # extracting to disk
                      try:
                          data = z.read(info)
                      except Exception as e:
                          print(f"{prefix}    (could not read nested archive: {e})")
                          continue
                      import io
                      try:
                          inner = zipfile.ZipFile(io.BytesIO(data))
                          for j in inner.infolist():
                              print(f"{prefix}    -> {j.file_size:>12}  {j.filename}")
                      except zipfile.BadZipFile:
                          print(f"{prefix}    -> not a nested zip (maybe rar/7z, unsupported here)")

          scan(sys.argv[1])
          PYEOF
          echo "== full listing, 2 levels deep for nested zips ==" | tee -a inspect.log
          python3 /tmp/inspect_zip.py "$dest" | tee -a inspect.log

      - name: Upload inspection result
        if: inputs.inspect_only == true
        uses: actions/upload-artifact@v4
        with:
          name: inspect-${{ inputs.name }}
          path: inspect.log
          retention-days: 7

      - name: Run build
        if: inputs.inspect_only == false
        run: |
          set -o pipefail
          ARGS=(build "${{ inputs.name }}" "${{ inputs.source }}" --type "${{ inputs.rom_type }}")
          if [ -n "${{ inputs.add_tag }}" ]; then ARGS+=(--add "${{ inputs.add_tag }}"); fi
          if [ "${{ inputs.compress }}" = "true" ]; then ARGS+=(--compress); fi
          if [ "${{ inputs.no_debloat }}" = "true" ]; then ARGS+=(--no-debloat); fi
          .venv/bin/python cli.py "${ARGS[@]}" 2>&1 | tee build.log

      - name: Snapshot work dir on failure
        if: always() && inputs.inspect_only == false
        run: |
          mkdir -p debug
          cp build.log debug/ 2>/dev/null || true
          find "tmp/${{ inputs.name }}" -maxdepth 4 > debug/tmp_tree.txt 2>&1 || true
          find "tmp/${{ inputs.name }}/images" -maxdepth 2 -exec ls -la {} \; > debug/images_listing.txt 2>&1 || true

      - name: Upload log (always)
        if: always() && inputs.inspect_only == false
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.name }}
          path: debug/**
          retention-days: 7

      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gsi-${{ inputs.name }}
          path: out/${{ inputs.name }}/**
          retention-days: 7
